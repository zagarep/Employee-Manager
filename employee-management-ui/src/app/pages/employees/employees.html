
<div class="container">
  <h1>Employee Management System</h1>

  <h2>Add Employee</h2>

  <div class="form-group">
    <label>Full Name</label>
    <input type="text"
           placeholder="Enter full name"
           [(ngModel)]="fullName">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email"
           placeholder="Enter email"
           [(ngModel)]="email">
  </div>

  <div class="form-group">
    <label>Department</label>
    <input type="text"
           placeholder="Enter department"
           [(ngModel)]="department">
  </div>

  <div class="form-group">
    <label>Salary</label>
    <input type="number"
           placeholder="Enter salary"
           [(ngModel)]="salary">
  </div>

  <button type="button" (click)="addEmployee()">
    {{ editEmployeeId !== null ? 'Update Employee' : 'Add Employee' }}
  </button>

  <h2>Employee List</h2>

  <table>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.id }}</td>
        <td>{{ emp.fullName }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.salary }}</td>
        <td>
          <button type="button"
                  (click)="editEmployee(emp)">
            Edit
          </button>
          <button type="button" (click)="deleteEmployee(emp.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
